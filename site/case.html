<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Study — Akshita R</title>
  <meta name="description" content="A case study from Akshita R's portfolio." />
  <meta name="theme-color" content="#2350dc" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232350dc'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" /><feDisplacementMap in="SourceGraphic" scale="2.4" /></filter>
  </svg>
  <aside class="side" data-side></aside>
  <header class="metro" data-metro></header>

  <main>
    <article class="case" data-case></article>
    <nav class="case__next" data-next aria-label="More projects"></nav>
    <footer class="footer"><span>© <span data-year></span> <span data-name></span></span><a href="./#contact">Get in touch →</a></footer>
  </main>

  <script src="assets/content.js"></script>
  <script src="assets/art.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/track.js"></script>
  <script>
    (() => {
      const P = window.PORTFOLIO;
      const { esc } = Shell;
      Shell.render({ base: "./", current: "work" });
      const id = new URLSearchParams(location.search).get("id");
      const i = Math.max(0, P.projects.findIndex((p) => p.id === id));
      const p = P.projects[i];
      const next = P.projects[(i + 1) % P.projects.length];
      document.title = `${p.title} — ${P.name}`;
      document.querySelectorAll("[data-name]").forEach((el) => (el.textContent = P.name));
      document.querySelectorAll("[data-year]").forEach((el) => (el.textContent = new Date().getFullYear()));
      window.track && window.track("project", p.id + "-case");

      const sid = (n) => `s${n + 1}`;
      document.querySelector("[data-case]").innerHTML = `
        <nav class="case__rail" aria-label="Case study sections">
          <ol>${p.sections.map((s, n) => `<li><a href="#${sid(n)}" data-rail="${sid(n)}">${esc(s.tag)}</a></li>`).join("")}</ol>
        </nav>
        <div>
          <p class="kicker"><a href="./#work">← All work</a></p>
          <dl class="case__facts">
            <div><dt>Role</dt><dd>${esc(p.role)}</dd></div>
            <div><dt>Timeline</dt><dd>${esc(p.timeline)}</dd></div>
            <div><dt>Tools</dt><dd>${esc(p.tools)}</dd></div>
            <div><dt>Team</dt><dd>${esc(p.team)}</dd></div>
          </dl>
          <h1>${esc(p.title)}</h1>
          <p class="case__intro">${esc(p.intro)}</p>
          <ul class="tags">${p.tags.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
          ${p.site ? `<a class="btn btn--line" href="${esc(p.site)}" target="_blank" rel="noopener" data-out="${esc(p.id)}-site">Visit the app ↗</a>` : ""}
          <div class="case__hero-art">${Art.scene(p.scene)}</div>
          ${p.sections.map((s, n) => `
            <section class="case__section" id="${sid(n)}">
              <p class="kicker">${String(n + 1).padStart(2, "0")} — ${esc(s.tag)}</p>
              <h2>${esc(s.h)}</h2>
              ${s.p.map((t) => `<p>${esc(t)}</p>`).join("")}
              ${s.stats ? `<div class="stats">${s.stats.map((x) => `<div><b>${esc(x.v)}</b><span>${esc(x.l)}</span></div>`).join("")}</div>` : ""}
            </section>`).join("")}
        </div>`;
      document.querySelector("[data-next]").innerHTML = `<a href="./#work">← All work</a><a href="case.html?id=${encodeURIComponent(next.id)}">Next project: ${esc(next.title)} →</a>`;

      document.addEventListener("click", (e) => {
        const out = e.target.closest("[data-out]");
        if (out) window.track && window.track("link", out.dataset.out);
      });
      const rail = [...document.querySelectorAll("[data-rail]")];
      const io = new IntersectionObserver((es) => es.forEach((en) => {
        if (en.isIntersecting) rail.forEach((a) => a.classList.toggle("is-current", a.dataset.rail === en.target.id));
      }), { rootMargin: "-40% 0px -55% 0px" });
      document.querySelectorAll(".case__section").forEach((s) => io.observe(s));
      rail[0] && rail[0].classList.add("is-current");
    })();
  </script>
</body>
</html>
